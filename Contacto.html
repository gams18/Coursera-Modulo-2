<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto | Café Catracho</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/open-iconic/1.1.1/font/css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="oi oi-cup"></span> Café Catracho</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#menu"
                aria-label="Menú"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"><span class="oi oi-home"></span>
                            Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html"><span class="oi oi-list"></span>
                            Productos</a></li>
                    <li class="nav-item active"><a class="nav-link" href="contacto.html"><span
                                class="oi oi-envelope-closed"></span> Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
                <li class="breadcrumb-item"><a href="productos.html">Productos</a></li>
                <li class="breadcrumb-item active">Contacto</li>
            </ol>
        </nav>
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <h2 class="mb-3"><span class="oi oi-envelope-closed"></span> Contáctanos</h2>
                <form class="bg-white p-4 border rounded">
                    <div class="form-group"><label for="nombre">Nombre</label><input type="text" class="form-control"
                            id="nombre" placeholder="Tu nombre" required></div>
                    <div class="form-group"><label for="email">Correo electrónico</label><input type="email"
                            class="form-control" id="email" placeholder="correo@ejemplo.com" required></div>
                    <div class="form-group"><label for="motivo">Motivo</label>
                        <select class="form-control" id="motivo">
                            <option>Comentario</option>
                            <option>Consulta</option>
                            <option>Suscripción</option>
                            <option>Compra</option>
                        </select>
                    </div>
                    <div class="form-group"><label for="mensaje">Mensaje</label><textarea class="form-control"
                            id="mensaje" rows="4" placeholder="Escribe tu mensaje"></textarea></div>
                    <div class="form-group form-check"><input type="checkbox" class="form-check-input" id="news"><label
                            class="form-check-label" for="news">Quiero recibir promociones</label></div>
                    <button type="submit" class="btn btn-warning btn-block"><span class="oi oi-envelope-closed"></span>
                        Enviar</button>
                </form>
            </div>
        </div>
    </div>
    <footer class="text-center py-3 mt-5"><small>© 2026 Café Catracho · Grupo 4</small></footer>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
